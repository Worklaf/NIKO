<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Playlist</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff4da6">
  <style>
    :root{
      --bg:#05050a;
      --muted:#bfc3d6;
      --card-bg: rgba(255,255,255,0.03);
      --card-hover: rgba(255,255,255,0.06);
      --player-height: 96px;
      --accent-1: #27b646;
      --accent-2: #ff7a4d;
      --accent-3: #ff4da6;
      --glass: rgba(255,255,255,0.03);
      --glass-border: rgba(255,255,255,0.06);
    }
    @media (max-width: 640px) { :root{ --player-height: 90px; } }
    html,body{height:100%;}
    body {
      background: var(--bg);
      color: #eaeaf2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      margin: 0;
      padding: 0;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* ========== HERO SECTION ========== */
    .playlist-hero {
      display: flex;
      gap: 20px;
      align-items: center;
      background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      min-width: 0;
    }
    .playlist-hero:hover {
      box-shadow: 0 12px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .playlist-cover {
      width: 140px;
      height: 140px;
      border-radius: 16px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 16px 48px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .playlist-hero:hover .playlist-cover {
      transform: scale(1.03) rotate(-1deg);
    }
    .playlist-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }
    .playlist-meta h1 {
      margin: 0;
      font-size: clamp(22px, 2.2vw, 32px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.6px;
      background: linear-gradient(135deg, #ffffff 0%, #bfc3d6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      word-break: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
    }
    #playlistCount {
      margin: 2px 0 0 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.3px;
      opacity: 0.9;
    }
    #playlistDesc { display: none; }

    /* BG Toggle */
    .playlist-bg-toggle {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .playlist-bg-toggle label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .playlist-bg-toggle select {
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23bfc3d6' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 32px;
      width: 100%;
      box-sizing: border-box;
    }
    .playlist-bg-toggle select:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.18);
    }
    .playlist-bg-toggle select:focus {
      border-color: var(--accent-1);
      box-shadow: 0 0 0 3px rgba(39, 182, 70, 0.15);
    }

    /* ========== ACTIONS BAR ========== */
    .playlist-actions-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #eaeaf2;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      white-space: nowrap;
    }
    .nav-btn:hover {
      background: rgba(255,255,255,0.09);
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.14);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
    .nav-btn:active { transform: translateY(0); }
    .nav-btn-primary {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      border: none;
      color: #fff;
      box-shadow: 0 4px 18px rgba(39, 182, 70, 0.35);
    }
    .nav-btn-primary:hover {
      box-shadow: 0 8px 28px rgba(39, 182, 70, 0.45);
      filter: brightness(1.08);
    }

    /* ========== CONTROLS / FILTERS ========== */
    .controls-row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .controls-left {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      font-size: 14px;
      opacity: 0.5;
      pointer-events: none;
    }
    #searchInput {
      background: rgba(255,255,255,0.04);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 10px 14px 10px 40px;
      border-radius: 12px;
      min-width: 240px;
      font-size: 14px;
      transition: all 0.2s;
      outline: none;
    }
    #searchInput::placeholder { color: rgba(191,195,214,0.5); }
    #searchInput:focus {
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 0 3px rgba(39, 182, 70, 0.1);
    }
    #genreFilter {
      background: rgba(255,255,255,0.04);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 10px 14px;
      border-radius: 12px;
      min-width: 150px;
      font-size: 14px;
      cursor: pointer;
      outline: none;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23bfc3d6' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 36px;
    }
    #genreFilter:focus { border-color: rgba(255,255,255,0.18); }
    #genreFilter option { background: #0f0f12; color: #fff; }

    /* ========== PAGE LAYOUT ========== */
    .page {
      display: flex;
      gap: 28px;
      padding: 24px;
      box-sizing: border-box;
      min-height: calc(100vh - var(--player-height) - 80px);
      padding-bottom: calc(var(--player-height) + 320px);
    }
    .left-col {
      width: 380px;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    /* ========== TRACKS ========== */
    #tracksContainer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .track {
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--card-bg);
      transition: background .2s ease, transform .1s ease, box-shadow .2s ease;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.02);
      min-width: 0;
    }
    .track:hover {
      background: linear-gradient(135deg, rgba(255, 77, 166, 0.12), rgba(0, 209, 255, 0.12));
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      border-color: rgba(255, 77, 166, 0.25);
    }
    .track.playing {
      background: linear-gradient(135deg, rgba(39, 182, 70, 0.18), rgba(255, 122, 77, 0.18));
      border-color: rgba(39, 182, 70, 0.35);
    }
    .track .thumb {
      width: 68px;
      height: 140px;
      border-radius: 15px;
      object-fit: cover;
      flex-shrink: 0;
      aspect-ratio: 3/4;
    }
    .track .meta {
      flex: 1;
      min-width: 0;
    }
    .track .meta .title {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
    }
    .track .meta .sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      opacity: 0.85;
    }
    .track .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: 8px;
    }
    .btn.play-btn {
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      color: #fff;
      border: none;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      min-width: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.2s;
    }
    .btn.play-btn:hover { filter: brightness(1.1); }
    .btn.play-btn.playing {
      background: linear-gradient(90deg, var(--accent-2), var(--accent-3));
    }
    .btn.play-btn svg { width: 16px; height: 16px; }

    /* ========== LOAD MORE ========== */
    .load-more-wrap {
      display: flex;
      justify-content: center;
      margin-top: 5px;
      margin-bottom: 100px;
    }
    .load-more-btn {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      border: none;
      padding: 14px 36px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 6px 24px rgba(39, 182, 70, 0.3);
      letter-spacing: 0.4px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .load-more-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(39, 182, 70, 0.4);
      filter: brightness(1.08);
    }
    .load-more-btn:active { transform: translateY(0); }

    /* ========== MINI PLAYER ========== */
    #mini-player {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.04);
      z-index: 9999;
      display: flex !important;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      box-sizing: border-box;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    }
    #mini-center img#mini-thumb {
      position: relative !important;
      left: auto !important;
      width: 36px !important;
      height: 36px !important;
      object-fit: cover !important;
      border-radius: 4px !important;
      margin-right: 8px;
      flex: 0 0 auto;
    }
    #mini-wave { flex: 1 1 auto; min-width: 0; }
    .time-display { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .control-btn {
      background: transparent;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .control-btn:hover { background: rgba(255,255,255,0.08); }
    .mini-controls { display: flex; align-items: center; gap: 6px; }
    .mini-actions .icon-row { display: flex; gap: 8px; align-items: center; }
    .btn.icon {
      background: transparent;
      border: none;
      color: #eaeaf2;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .btn.icon:hover { background: rgba(255,255,255,0.08); color: #fff; }

    /* ========== MODALS ========== */
    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2,2,6,0.65);
      z-index: 10050;
      padding: 20px;
    }
    .modal .panel {
      background: linear-gradient(180deg, rgba(14,14,18,0.98), rgba(8,8,10,0.98));
      border-radius: 16px;
      padding: 20px;
      color: #eaeaf2;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.06);
      max-width: 720px;
      width: 100%;
    }
    .modal .btn {
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .modal .btn:hover { background: rgba(255,255,255,0.1); }
    .modal .btn.active {
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent-3), var(--accent-2));
      border: none;
    }
    .modal pre { margin: 0; color: var(--muted); }
    .likes-count.active, .likes-count.active .num { color: #000 !important; }
    .dislikes-count.active, .dislikes-count.active .num { color: #000 !important; }

    /* ========== DESKTOP: fixed layout with scrollable columns ========== */
    @media (min-width: 981px) {
      .page {
        height: calc(100vh - var(--player-height));
        padding-bottom: 0;
        overflow: hidden;
      }
      .left-col {
        height: 100%;
        overflow-y: auto;
      }
      .right-col {
        height: 100%;
        overflow-y: auto;
      }
      /* Ensure last track row is always visible above the player */
      #tracksContainer {
        padding-bottom: 140px;
      }
      /* Hide the spacer on desktop - not needed with internal scrolling */
      .right-col > div:last-child { display: none; }
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1100px) {
      #tracksContainer { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 980px) {
      .page { flex-direction: column; padding-bottom: calc(var(--player-height) + 100px); }
      .left-col { width: 100%; min-width: unset; }
      .playlist-hero { flex-direction: column; text-align: center; }
      .playlist-meta { align-items: center; }
      .playlist-bg-toggle { align-items: center; max-width: 280px; }
      #tracksContainer { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .page { padding: 16px; padding-bottom: calc(var(--player-height) + 240px); }
      .playlist-hero { padding: 20px; border-radius: 20px; }
      .playlist-cover { width: 120px; height: 120px; }
      .playlist-meta h1 { font-size: 24px; }
      .playlist-actions-bar { justify-content: center; }
      .controls-left { width: 100%; flex-direction: column; }
      .search-box, #genreFilter { width: 100%; }
      #searchInput { min-width: unset !important; width: 100%; }
      .nav-btn { padding: 10px 16px; font-size: 13px; }
      .track .thumb { width: 64px; height: 100px; }
      .load-more-wrap { margin-bottom: 150px; }
    }
    @media (max-width: 520px) {
      .playlist-cover { width: 110px; height: 110px; }
    }
  
    /* ===== COMMENTS & EMOJI MODAL STYLES ===== */
    .comments-list { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
    .emoji-quick-access { flex-wrap: wrap; }
    .emoji-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 18px; transition: background .2s; color: #eaeaf2; }
    .emoji-btn:hover { background: rgba(255,255,255,0.12); }
    .emoji-popup-modal {
      position: fixed; inset: 0; background: rgba(2,2,6,0.8); z-index: 10100;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .emoji-popup-modal.open { display: flex; }
    .emoji-popup-modal .panel { max-width: 480px; width: 100%; }
    .emoji-popup-grid {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
      max-height: 50vh; overflow-y: auto; padding: 10px;
      background: rgba(255,255,255,0.03); border-radius: 12px;
    }
    .emoji-popup-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 6px; cursor: pointer; font-size: 20px; transition: background .2s; }
    .emoji-popup-btn:hover { background: rgba(255,255,255,0.12); }
    .delete-comment { position:absolute; top:8px; right:8px; background:none; border:none; color:#ff4da6; cursor:pointer; font-size:14px; }
    /* ========== SIDE PANEL ========== */
    .side-panel {
      position: fixed;
      top: 0; right: 0;
      width: 100%; max-width: 480px;
      height: 100%;
      background: linear-gradient(180deg, rgba(14,14,18,0.98), rgba(8,8,10,0.98));
      z-index: 10050;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      border-left: 1px solid rgba(255,255,255,0.06);
    }
    .side-panel.open { transform: translateX(0); }
    .side-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .side-panel-actions { display: flex; gap: 8px; }
    .side-panel-actions button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #eaeaf2;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .side-panel-actions button:hover { background: rgba(255,255,255,0.1); }
    .edit-mode-actions.active { display: flex !important; }
    @media (max-width: 640px) {
      .side-panel { max-width: 100%; }
    }
  </style>

<body>
<!-- [FIX] Индикатор офлайн-режима -->
<div id="offline-indicator" style="display:none;position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(255,77,166,0.9);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;z-index:99999;box-shadow:0 4px 20px rgba(255,77,166,0.4);"></div>

<div id="spa-playlist-content">

  <!-- ===== PAGE ===== -->
  <div class="page">
    <!-- LEFT: Hero -->
    <div class="left-col">
      <div class="playlist-hero" id="playlistInfo">
        <img id="playlistCover" class="playlist-cover" src="" alt="cover">
        <div class="playlist-meta">
          <h1 id="playlistName">Playlist</h1>
          <p id="playlistDesc"></p>
          <p id="playlistCount">0 track(s) <span id="playlistHiddenBadge" style="display:none;font-size:12px;opacity:.6;margin-left:8px;">👁️‍🗨️ Hidden from home</span></p>
          <div class="playlist-bg-toggle">
            <label for="bg-selector">🎨 Background</label>
            <select id="bg-selector">
              <option value="cover">Cover image</option>
              <option value="dark">Dark gradient</option>
              <option value="purple">Purple gradient</option>
              <option value="blue">Blue gradient</option>
              <option value="green">Green gradient</option>
              <option value="orange">Orange gradient</option>
              <option value="pink">Pink gradient</option>
              <option value="none">Solid color</option>
            </select>
          </div>
          <div class="playlist-bg-toggle" id="hideFromHomeWrap" style="margin-top:12px;display:none;background:rgba(255,77,166,0.08);border:1px solid rgba(255,77,166,0.2);border-radius:10px;padding:10px 12px;">
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:600;">
              <input type="checkbox" id="playlistHideFromHomeToggle" style="width:20px;height:20px;cursor:pointer;accent-color:#ff4da6;flex-shrink:0;">
              <span>👁️‍🗨️ Hide tracks from home page</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Actions + Filters + Tracks -->
    <div class="right-col">
      <!-- Actions Bar -->

        document.getElementById('playlistName').textContent = 'Playlist ID missing';
        return;
      }
      const playlistDoc = await db.collection('playlists').doc(playlistId).get();
      if (!playlistDoc.exists) {

    window.updateLikeUI = function(trackId, likesDelta = 0, dislikesDelta = 0) {
  const likeEl = document.querySelector('.likes-count[data-key="' + trackId + '"]');
  const dislikeEl = document.querySelector('.dislikes-count[data-key="' + trackId + '"]');
  const userVote = localStorage.getItem('like:user:' + trackId);
  
  if (likeEl) {
    const numEl = likeEl.querySelector('.num');
    if (numEl) {
      // Используем текущее значение из DOM + delta
      const current = parseInt(numEl.textContent, 10) || 0;
      numEl.textContent = Math.max(0, current + likesDelta);

    likeEl.classList.toggle('active', userVote === 'like');

};

// Функция обработки поиска (должна быть доступна в scope)
function handleAddSearch(e) {
    const filterText = e.target.value;
    window.renderAddList(filterText);
}

    window.renderAddList = function(filter) {
      const listEl = document.getElementById(listId);
      if (!listEl) return;
      listEl.innerHTML = '';
      const q = (filter || '').toLowerCase();
      const pid = (window.currentPlaylistForAdd || new URLSearchParams(location.search).get('id') || null);
      const role = localStorage.getItem('siteRole') || 'guest';
      const currentUser = window.currentUserId || localStorage.getItem('userId');
      const tracks = window.globalTracks || [];

      const ownerCandidates = ['ownerId','owner','uploadedBy','uploadedById','userId','createdBy','author'];
      const sample = tracks.find(Boolean);
      const ownerField = ownerCandidates.find(f => sample && typeof sample[f] !== 'undefined') || null;

      const candidates = tracks.filter(t => {
        if (!t) return false;
        if (!isVisibleToRole(t, role)) return false;
        const p = t.playlistIds || t.playlists || t.playlist || [];
        if (pid) {
          if (Array.isArray(p) && p.map(String).includes(String(pid))) return false;
          if (!Array.isArray(p) && p !== undefined && String(p) === String(pid)) return false;
        }
        if (q) {
          const title = (t.title || '').toLowerCase();
          const genre = (t.genre || '').toLowerCase();
          if (!title.includes(q) && !genre.includes(q)) return false;
        }
        if (role === 'admin') return true;
        if (role === 'partner') {
          if (t.visibility === 'public' || t.visibility === 'partner') return true;
          if (!t.visibility) return true;
          if (ownerField && currentUser && t[ownerField] && String(t[ownerField]) === String(currentUser)) return true;
          return false;
        }
        if (role === 'user') {
          if (t.visibility === 'public' || !t.visibility) return true;
          if (ownerField && currentUser && t[ownerField] && String(t[ownerField]) === String(currentUser)) return true;
          return false;
        }
        return false;
      });

      if (!candidates.length) {
        listEl.innerHTML = '<div style="padding:12px;color:var(--muted)">No tracks available to add</div>';
        return;
      }
      candidates.forEach(t => {
        const id = t.id || '';
        const cover = t.cover || '';
        const title = t.title || '';
        const row = document.createElement('label');
        row.style = 'display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer';
        row.innerHTML =
          '<input type="checkbox" class="add-select-checkbox" data-id="' + escapeHtml(id) + '" style="width:18px;height:18px">' +
          '<img src="' + escapeHtml(cover) + '" style="width:48px;height:48px;border-radius:6px;object-fit:cover">' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-weight:600">' + escapeHtml(title) + '</div>' +
            '<div style="font-size:13px;color:var(--muted)">' + escapeHtml(t.genre || '') + '</div>' +
          '</div>';
        listEl.appendChild(row);
      });
    };

    function isVisibleToRole(item, role) {
      if (!item) return false;
      if (item.visibility === 'hidden') return role === 'admin';
      if (item.visibility === 'partner') return role === 'admin' || role === 'partner';
      return true;
    }

    document.getElementById('open-add-to-playlist-top')?.addEventListener('click', () => {
      openAddToPlaylistModal(playlistId || null);
    });

    window.removeTrackFromPlaylist = async function(trackId, targetPlaylistId) {
      if (!trackId || !targetPlaylistId) return;
      if (!confirm('Remove this track from playlist?')) return;
      try {
        const tref = db.collection('tracks').doc(trackId);
        const pref = db.collection('playlists').doc(targetPlaylistId);
        const pdoc = await pref.get();
        if (!pdoc.exists) {
          await tref.update({ playlistIds: firebase.firestore.FieldValue.arrayRemove(targetPlaylistId) });
          await reloadTracks();
          renderTracksPage();
          renderAddList('');
          return;
        }
        const batch = db.batch();
        batch.update(tref, { playlistIds: firebase.firestore.FieldValue.arrayRemove(targetPlaylistId) });
        batch.update(pref, {
          trackIds: firebase.firestore.FieldValue.arrayRemove(trackId),
          songCount: firebase.firestore.FieldValue.increment(-1)
        });
        await batch.commit();
        await reloadTracks();
        renderTracksPage();
        renderAddList('');
        const countEl = document.getElementById('playlistCount');
        if (countEl) {
          const cur = Number(countEl.dataset._count || (parseInt(countEl.textContent,10) || 0));
          const newVal = Math.max(0, cur - 1);
          countEl.textContent = newVal + ' track(s)';
          countEl.dataset._count = newVal;
        }
      } catch (e) {
        console.error('Failed to remove from playlist', e);
        alert('Remove failed');
      }
    };

    async function reloadTracks() {
      if (!playlistId) return;
      const snap = await db.collection('tracks')
        .where('playlistIds', 'array-contains', playlistId)
        .get();
      allTracksFull = snap.docs.map((d, i) => ({ __fullIndex: i, id: d.id, ...d.data() }));
      window.globalTracks = allTracksFull;
      visibleTracks = allTracksFull.slice();
      visibleCount = INITIAL_VISIBLE;
      renderTracksPage();
    }

    (function patchAddButtonsOnPlaylist() {
      document.getElementById('tracksContainer')?.addEventListener('click', (ev) => {
        const btn = ev.target.closest('.add-to-playlist-btn');
        if (!btn) return;
        const trackEl = btn.closest('.track');
        if (!trackEl) return;
        const tid = trackEl.dataset.id;
        const inPlaylist =
          typeof playlistId !== 'undefined' &&
          playlistId &&
          Array.isArray((window.globalTracks || []).find(x => x && x.id === tid)?.playlistIds) &&
          (window.globalTracks.find(x => x && x.id === tid).playlistIds || []).includes(playlistId);
        if (inPlaylist) {
          removeTrackFromPlaylist(tid, playlistId);
        } else {
          openAddToPlaylistModal(playlistId || null);
        }
      });
    })();

    (function attachAddToPlaylistHandlers() {
      const modalIdLocal = 'add-to-playlist-modal';
      const confirmIdLocal = 'add-to-playlist-confirm';
      const closeIdLocal = 'add-to-playlist-close';
      const cancelIdLocal = 'add-to-playlist-cancel';
      const selectAllIdLocal = 'add-select-all';

      function closeAddModal() {
        const m = document.getElementById(modalIdLocal);
        if (m) m.style.display = 'none';
      }
      function resolvePlaylistId() {
        const modalEl = document.getElementById(modalIdLocal);
        const fromModalData = modalEl?.dataset?.playlistId || null;
        const fromWindow = window.currentPlaylistForAdd || null;
        const fromVar = (typeof playlistId !== 'undefined' && playlistId) ? playlistId : null;
        const fromUrl = new URLSearchParams(location.search).get('id') || null;
        return fromWindow || fromModalData || fromVar || fromUrl || null;
      }
      async function handleConfirm() {
        const pid = resolvePlaylistId();
        const selected = Array.from(document.querySelectorAll('.add-select-checkbox:checked'))
          .map(cb => cb.dataset.id)
          .filter(Boolean);
        if (!selected.length) { alert('No tracks selected'); return; }
        if (!pid) { alert('No playlist selected'); return; }
        try {
          const toAdd = [];
          for (const tid of selected) {
            const g = (window.globalTracks || []).find(x => x && x.id === tid);
            if (!g) continue;
            const val = g.playlistIds || [];
            const already = Array.isArray(val)
              ? val.map(String).includes(String(pid))
              : (val !== undefined && String(val) === String(pid));
            if (!already) toAdd.push(tid);
          }
          if (!toAdd.length) {
            alert('Selected tracks are already in this playlist');
            return;
          }
          const pref = db.collection('playlists').doc(pid);
          const pdoc = await pref.get();
          if (!pdoc.exists) {
            await pref.set({ trackIds: [], songCount: 0 }, { merge: true });
          }
          const batch = db.batch();
          for (const tid of toAdd) {
            const tref = db.collection('tracks').doc(tid);
            batch.update(tref, { playlistIds: firebase.firestore.FieldValue.arrayUnion(pid) });
            const g = (window.globalTracks || []).find(x => x && x.id === tid);
            if (g) {
              g.playlistIds = Array.isArray(g.playlistIds)
                ? Array.from(new Set([...(g.playlistIds || []), pid]))
                : [pid];
            }
          }
          batch.update(pref, {
            trackIds: firebase.firestore.FieldValue.arrayUnion(...toAdd),
            songCount: firebase.firestore.FieldValue.increment(toAdd.length)
          });
          await batch.commit();
          await reloadTracks();
          const confirmBtn = document.getElementById(confirmIdLocal);
          if (confirmBtn) confirmBtn.textContent = 'Added ✓';
          setTimeout(() => {
            if (confirmBtn) confirmBtn.textContent = 'Add selected';
            closeAddModal();
            if (typeof renderTracksPage === 'function') renderTracksPage();
            renderAddList('');
            const countEl = document.getElementById('playlistCount');
            if (countEl) {
              const cur = Number(countEl.dataset._count || (parseInt(countEl.textContent,10) || 0));
              const newVal = cur + toAdd.length;
              countEl.textContent = newVal + ' track(s)';
              countEl.dataset._count = newVal;
            }
          }, 700);
        } catch (err) {
          console.error('Add to playlist failed', err);
          alert('Add failed — check console for details');
        }
      }
      function init() {
        const modalEl = document.getElementById(modalIdLocal);
        if (!modalEl) return;
        modalEl.addEventListener('click', (ev) => {
          const target = ev.target;
          if (!target) return;
          if (target.id === closeIdLocal || target.id === cancelIdLocal) {
            ev.preventDefault();
            closeAddModal();
            return;
          }
          if (target.id === confirmIdLocal) {
            ev.preventDefault();
            handleConfirm();
            return;
          }
        });
        const selectAll = document.getElementById(selectAllIdLocal);
        if (selectAll) {
          selectAll.addEventListener('change', (e) => {
            const checked = !!e.target.checked;
            document.querySelectorAll('.add-select-checkbox').forEach(cb => cb.checked = checked);
          });
        }
        modalEl.addEventListener('click', (ev) => {
          if (ev.target === modalEl) closeAddModal();
        });
        document.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape') closeAddModal();
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  })();
  </script>

<script>
(function() {
  const isAdmin = (typeof getRoleSafe === 'function' ? getRoleSafe() : (localStorage.getItem('siteRole')||'guest')) === 'admin';

  async function loadCommentsFromServer(trackId) {
    const snap = await db.collection('tracks').doc(trackId).collection('comments').orderBy('timestamp', 'asc').get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  async function saveCommentToServer(trackId, comment) {
    try { await db.collection('tracks').doc(trackId).collection('comments').add(comment); return true; }
    catch (e) { console.error(e); return false; }
  }

  async function deleteCommentFromServer(trackId, commentId) {
    try { await db.collection('tracks').doc(trackId).collection('comments').doc(commentId).delete(); return true; }
    catch (e) { console.error(e); return false; }
  }

  window.openComments = function(trackId) {
    currentCommentTrackId = trackId;
    const modal = document.getElementById('comments-modal');
    if (modal) { modal.style.display = 'flex'; modal.setAttribute('aria-hidden', 'false'); }
    loadComments(trackId);
  };

  async function loadComments(trackId) {
    const list = document.getElementById('comments-list');
    if (!list) return;
    list.innerHTML = '<p style="color:#bfc3d6;text-align:center;padding:20px">⏳ Loading...</p>';

    list.innerHTML = '';
    if (comments.length === 0) {

      return;
    }
    comments.forEach((comment) => {
      const div = document.createElement('div');

      const date = new Date(comment.timestamp);
      const dateStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      div.innerHTML = `

  function initEmojiSystem() {

  }

  function insertEmoji(emoji) {
    const input = document.getElementById('comment-input');
    if (!input) return;
    const start = input.selectionStart;
    const end = input.selectionEnd;
    const text = input.value;
    input.value = text.substring(0, start) + emoji + text.substring(end);
    input.selectionStart = input.selectionEnd = start + emoji.length;
    input.focus();
    document.getElementById('emoji-popup-modal')?.classList.remove('open');
  }

  // Event listeners
  document.addEventListener('DOMContentLoaded', () => {
    initEmojiSystem();

    document.getElementById('comment-cancel')?.addEventListener('click', () => {
      const modal = document.getElementById('comments-modal');
      if (modal) { modal.style.display = 'none'; modal.setAttribute('aria-hidden', 'true'); }
    });

    document.getElementById('comment-send')?.addEventListener('click', async () => {
      const input = document.getElementById('comment-input');
      const text = input?.value.trim();
      if (!text) { alert('Write a comment first'); return; }
      const sendBtn = document.getElementById('comment-send');
      const originalText = sendBtn.textContent;
      sendBtn.textContent = '⏳...';
      sendBtn.disabled = true;
      const comment = { text: text, author: 'User', timestamp: Date.now() };
      const success = await saveCommentToServer(currentCommentTrackId, comment);
      if (success) {
        if (input) input.value = '';
        await loadComments(currentCommentTrackId);
        sendBtn.textContent = '✅';
        setTimeout(() => { sendBtn.textContent = originalText; sendBtn.disabled = false; }, 1000);
      } else {
        alert('Error sending comment');
        sendBtn.textContent = originalText;
        sendBtn.disabled = false;
      }
    });

    document.getElementById('mini-comment')?.addEventListener('click', () => {
      const tid = window.currentTrackId || currentCommentTrackId;
      if (tid) openComments(tid);
    });

    // Close modal on backdrop click
    document.getElementById('comments-modal')?.addEventListener('click', (ev) => {
      if (ev.target === ev.currentTarget) {
        ev.currentTarget.style.display = 'none';
        ev.currentTarget.setAttribute('aria-hidden', 'true');
      }
    });
  });
})();


// ===============================
// SYNC WITH PARENT PLAYER
// ===============================

(function() {
  const isEmbed = new URLSearchParams(location.search).get('embed') === '1';
  if (!isEmbed) return;

  // Запрашиваем текущее состояние плеера при загрузке
  if (window.parent && window.parent !== window) {
    window.parent.postMessage('get-player-state', '*');
  }

  // Слушаем сообщения от родителя
  window.addEventListener('message', (e) => {
    const data = e.data;
    if (!data || !data.type) return;

    if (data.type === 'player-state') {
      // Обновляем визуальное выделение играющего трека
      window.currentTrackId = data.trackId;
      window.isPlaying = data.isPlaying;
      updatePlaylistPlayIcons();
    }
    else if (data.type === 'counters-update') {
      // Обновляем счётчики лайков/дизлайков
      updatePlaylistCounters(data.trackId, data.likes, data.dislikes, data.userVote);
    }
  });

  function updatePlaylistPlayIcons() {
    document.querySelectorAll('.track').forEach(el => {
      const id = el.dataset.id;
      const playBtn = el.querySelector('.play-btn');
      if (!playBtn) return;

      if (id === window.currentTrackId && window.isPlaying) {
        el.classList.add('playing');
        playBtn.classList.add('playing');
        playBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
      } else {
        el.classList.remove('playing');
        playBtn.classList.remove('playing');
        playBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3v18l15-9L5 3z"/></svg>';
      }
    });
  }

  function updatePlaylistCounters(trackId, likes, dislikes, userVote) {
    const likeEl = document.querySelector('.likes-count[data-key="' + trackId + '"]');
    const dislikeEl = document.querySelector('.dislikes-count[data-key="' + trackId + '"]');
    if (likeEl) {
      const num = likeEl.querySelector('.num');
      if (num) num.textContent = likes;
      likeEl.classList.toggle('active', userVote === 'like');
    }
    if (dislikeEl) {
      const num = dislikeEl.querySelector('.num');
      if (num) num.textContent = dislikes;
      dislikeEl.classList.toggle('active', userVote === 'dislike');
    }
  }
})();


// ===== SHARE MODAL LOGIC =====
(function() {
  const modal = document.getElementById('share-modal');
  const closeBtn = document.getElementById('share-modal-close');
  const copyBtn = document.getElementById('share-copy-link');

  closeBtn?.addEventListener('click', () => modal?.classList.remove('open'));

  copyBtn?.addEventListener('click', async () => {
    const track = (window.globalTracks || []).find(t => t.id === window.currentTrackId) ||
                  (window.currentPlaylistTracks || []).find(t => t.id === window.currentTrackId);
    const trackId = track?.id || window.currentTrackId || '';
    if (!trackId) { alert('No track selected'); return; }
    const shareUrl = window.location.origin + '/NIKO.html?track=' + encodeURIComponent(trackId);
    try {
      await navigator.clipboard.writeText(shareUrl);
      const original = copyBtn.innerHTML;
      copyBtn.innerHTML = '<div style="width:36px;height:36px;border-radius:10px;background:rgba(77,255,138,0.15);display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4dff8a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div><div style="color:#4dff8a;font-size:13px;font-weight:600;">Copied!</div></div>';
      setTimeout(() => copyBtn.innerHTML = original, 2000);
    } catch (e) { console.error(e); }
  });

  document.querySelectorAll('#share-socials .social-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const platform = btn.dataset.platform;
      const track = (window.globalTracks || []).find(t => t.id === window.currentTrackId) ||
                    (window.currentPlaylistTracks || []).find(t => t.id === window.currentTrackId);
      const shareUrl = window.location.origin + '/NIKO.html?track=' + encodeURIComponent(track?.id || '');
      const text = encodeURIComponent('Check out: ' + (track?.title || 'Track'));
      const urls = {
        twitter: `https://twitter.com/intent/tweet?url=${encodeURIComponent(shareUrl)}&text=${text}`,
        facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`,
        telegram: `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${text}`,
        whatsapp: `https://wa.me/?text=${text}%20${encodeURIComponent(shareUrl)}`,
        viber: `viber://forward?text=${text}%20${encodeURIComponent(shareUrl)}`,
        messenger: `fb-messenger://share/?link=${encodeURIComponent(shareUrl)}`,
        tiktok: `https://www.tiktok.com/`,
        native: () => { if (navigator.share) navigator.share({title: track?.title || 'Track', url: shareUrl}); else alert('Web Share not supported'); }
      };
      if (platform === 'native') { urls.native(); }
      else if (urls[platform]) { window.open(urls[platform], '_blank'); }
    });
  });

  // Закрытие по клику на фон
  modal?.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
})();
</script>
